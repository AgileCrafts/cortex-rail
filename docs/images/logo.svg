<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop stop-color="#141026"/>
      <stop offset="1" stop-color="#0a0b16"/>
    </linearGradient>
    <radialGradient id="glow" cx="128" cy="120" r="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a78bfa" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="node" x1="96" y1="88" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- badge -->
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#glow)"/>
  <rect x="8.5" y="8.5" width="239" height="239" rx="53.5" stroke="#a78bfa" stroke-opacity="0.22"/>

  <!-- rails: three signal tracks from the cortex out to satellite nodes -->
  <g stroke-linecap="round">
    <!-- track pairs (the "rail") -->
    <g stroke="#7c5cff" stroke-opacity="0.55" stroke-width="4">
      <path d="M128 128 L60 64"/>
      <path d="M128 128 L206 78"/>
      <path d="M128 128 L128 210"/>
    </g>
    <g stroke="#a78bfa" stroke-opacity="0.9" stroke-width="2" filter="url(#soft)">
      <path d="M128 128 L60 64"/>
      <path d="M128 128 L206 78"/>
      <path d="M128 128 L128 210"/>
    </g>
  </g>

  <!-- rail ties (little cross-hatches to read as a track near the core) -->
  <g stroke="#c4b5fd" stroke-opacity="0.7" stroke-width="3" stroke-linecap="round">
    <path d="M150 116 l8 -6"/>
    <path d="M138 100 l8 -6"/>
    <path d="M120 150 l8 -6"/>
  </g>

  <!-- satellite nodes -->
  <g>
    <circle cx="60" cy="64" r="13" fill="#26c6da"/>
    <circle cx="60" cy="64" r="13" fill="#26c6da" filter="url(#soft)" opacity="0.7"/>
    <circle cx="206" cy="78" r="11" fill="#a78bfa"/>
    <circle cx="206" cy="78" r="11" fill="#a78bfa" filter="url(#soft)" opacity="0.7"/>
    <circle cx="128" cy="210" r="10" fill="#34d399"/>
    <circle cx="128" cy="210" r="10" fill="#34d399" filter="url(#soft)" opacity="0.7"/>
  </g>

  <!-- the cortex: central node with a bright core -->
  <circle cx="128" cy="128" r="40" fill="url(#node)" filter="url(#soft)" opacity="0.55"/>
  <circle cx="128" cy="128" r="34" fill="url(#node)"/>
  <circle cx="128" cy="128" r="34" stroke="#e6e9f5" stroke-opacity="0.35" stroke-width="1.5"/>
  <circle cx="118" cy="118" r="9" fill="#ffffff" fill-opacity="0.9"/>
</svg>
